<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>性別歧視言論 AI 偵測系統</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 700px; margin: 60px auto; background-color: #f5f7fb; color: #333; }
        .container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 8px 24px rgba(149, 157, 165, 0.2); text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 25px; }
        textarea { width: 100%; height: 120px; padding: 15px; font-size: 16px; border: 2px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; resize: none; transition: border-color 0.2s; }
        textarea:focus { outline: none; border-color: #3498db; }
        button { background-color: #3498db; color: white; padding: 12px 30px; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 20px; transition: background-color 0.2s; }
        button:hover { background-color: #2980b9; }
        #result-box { margin-top: 35px; padding: 20px; border-radius: 8px; display: none; font-size: 18px; font-weight: bold; }
        .sexist { background-color: #fde8e8; color: #e74c3c; border: 1px solid #f8b4b4; }
        .not-sexist { background-color: #edfbf3; color: #2ecc71; border: 1px solid #b7ebb4; }
    </style>
</head>
<body>

<div class="container">
    <h2>🚫 性別歧視言論 AI 偵測系統</h2>
    <p>期末報告專案呈現 - 請在下方輸入社群言論文字</p>
    <textarea id="inputText" placeholder="例如：女生本來就應該留在家裡帶小孩，讀什麼工程系..."></textarea>
    <br>
    <button onclick="checkSexism()">開始 AI 偵測</button>
    <div id="result-box" id="resultBox"></div>
</div>

<script>
async function checkSexism() {
    const text = document.getElementById("inputText").value;
    const resultBox = document.getElementById("result-box");
    if (!text.trim()) { alert("請先輸入一些文字！"); return; }
    
    resultBox.style.display = "block";
    resultBox.className = ""; // 清空舊的樣式
    resultBox.style.backgroundColor = "#f1f2f6";
    resultBox.style.color = "#57606f";
    resultBox.innerHTML = "🔄 AI 正在分析語意中，請稍候...";
    
    try {
        // 發送請求到你本地跑的 FastAPI (Port 8000)
        const response = await fetch('http://127.0.0.1:8000/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text: text })
        });
        const data = await response.json();
        
        // 根據後端回傳結果渲染網頁
        if (data.prediction === "Sexist") {
            resultBox.className = "sexist";
            resultBox.innerHTML = `🚨 偵測結果：此言論含有「性別歧視」傾向！`;
        } else {
            resultBox.className = "not-sexist";
            resultBox.innerHTML = `✅ 偵測結果：此言論正常（未偵測到性別歧視）。`;
        }
    } catch (error) {
        resultBox.style.backgroundColor = "#ffeaa7";
        resultBox.style.color = "#d63031";
        resultBox.innerHTML = "❌ 無法連線到後端 API！請確認你的 FastAPI 是否已經在終端機啟動。";
    }
}
</script>

</body>
</html>
